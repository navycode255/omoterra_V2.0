# Apache config for the omoterra.jopex.co.tz document root.
#
# Install as .htaccess in the SUBDOMAIN'S DOCUMENT ROOT — not in the
# application directory, and never overwrite it with Python source: Apache
# parses this file as configuration, so a stray .py in its place makes every
# request on the subdomain fail with 500 before any app is reached.
#
# This proxies to the uvicorn process started by restart-omoterra.sh on
# 127.0.0.1:8011. It is an alternative to cPanel's Setup Python App and
# passenger_wsgi.py — use one or the other, not both.

RewriteEngine On

# Hand every path to the ASGI app, including /health and /api/v1/*.
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^(.*)$ http://127.0.0.1:8011/$1 [P,QSA,L]

# Preserve the original host and scheme so the app builds correct URLs.
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
</IfModule>

# Never serve the app's own files if the document root is ever pointed at
# the application directory by mistake.
<FilesMatch "\.(py|env|lock|sh|log|pid)$">
    Require all denied
</FilesMatch>
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>
