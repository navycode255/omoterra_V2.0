name: CI

# M0.1: every push and pull request runs the backend tests against a
# throwaway PostgreSQL (no test may skip), then the dashboard type-check,
# lint and the Playwright suite (ops/e2e).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omoterra
          POSTGRES_PASSWORD: omoterra
          POSTGRES_DB: omoterra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omoterra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      OMOTERRA_TEST_DATABASE_URL: postgresql+psycopg://omoterra:omoterra@localhost:5432/omoterra
      OMOTERRA_AUTO_MIGRATE: 'false'
      # conftest.py: a missing database is an error and any skipped test fails the run.
      OMOTERRA_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -rs

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omoterra
          POSTGRES_PASSWORD: omoterra
          POSTGRES_DB: omoterra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omoterra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ops
    env:
      # e2e/harness.py drops and recreates this database for the run.
      OMOTERRA_E2E_DATABASE_URL: postgresql+psycopg://omoterra:omoterra@localhost:5432/omoterra_e2e
      OMOTERRA_E2E_PYTHON: python
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint app components lib
      - run: npx playwright install --with-deps chromium
      - name: Playwright (backend + next build + e2e)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ops/playwright-report
            ops/test-results
          retention-days: 7
